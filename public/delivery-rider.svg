<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#243044" flood-opacity=".16"/>
    </filter>
    <linearGradient id="scooter" x1="240" y1="205" x2="430" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13D6BE"/>
      <stop offset="1" stop-color="#00A995"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- delivery box -->
    <rect x="132" y="112" width="132" height="112" rx="22" fill="#00C7AE"/>
    <rect x="150" y="133" width="96" height="55" rx="13" fill="#E9FFFB"/>
    <path d="M171 160H225" stroke="#00A995" stroke-width="10" stroke-linecap="round"/>
    <rect x="159" y="202" width="77" height="13" rx="6.5" fill="#009E8D" opacity=".65"/>

    <!-- scooter body -->
    <path d="M228 251C240 218 269 201 305 201H398C425 201 446 218 455 242L467 272H259C239 272 222 265 216 254L228 251Z" fill="url(#scooter)"/>
    <path d="M310 203H393L417 241H282L310 203Z" fill="#151D28"/>
    <path d="M407 204H453L478 259" stroke="#202A36" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M450 199H482" stroke="#202A36" stroke-width="10" stroke-linecap="round"/>
    <rect x="276" y="190" width="110" height="22" rx="11" fill="#202A36"/>

    <!-- wheels -->
    <circle cx="263" cy="274" r="49" fill="#1D2733"/>
    <circle cx="263" cy="274" r="26" fill="#F5F7FA"/>
    <circle cx="263" cy="274" r="10" fill="#AAB4C0"/>
    <circle cx="477" cy="274" r="49" fill="#1D2733"/>
    <circle cx="477" cy="274" r="26" fill="#F5F7FA"/>
    <circle cx="477" cy="274" r="10" fill="#AAB4C0"/>

    <!-- rider torso -->
    <path d="M318 138C337 126 368 126 388 143L418 183L381 211L337 183L303 178L318 138Z" fill="#364554"/>
    <path d="M337 183L322 237" stroke="#364554" stroke-width="24" stroke-linecap="round"/>
    <path d="M322 237L276 250" stroke="#2A3541" stroke-width="20" stroke-linecap="round"/>
    <path d="M379 194L410 233" stroke="#364554" stroke-width="22" stroke-linecap="round"/>
    <path d="M410 233L442 245" stroke="#2A3541" stroke-width="18" stroke-linecap="round"/>

    <!-- head + helmet -->
    <circle cx="352" cy="107" r="39" fill="#F0BF99"/>
    <path d="M312 108C312 75 335 55 363 55C393 55 413 78 413 108V116H312V108Z" fill="#00C7AE"/>
    <path d="M315 108H414" stroke="#E7FFFB" stroke-width="12" stroke-linecap="round"/>
    <path d="M392 90C410 95 421 107 426 120" stroke="#00A995" stroke-width="8" stroke-linecap="round"/>
    <circle cx="366" cy="110" r="4" fill="#26313E"/>
    <path d="M374 127C381 130 388 128 392 123" stroke="#9C5C42" stroke-width="4" stroke-linecap="round"/>

    <!-- arms on handlebar -->
    <path d="M388 151L427 184" stroke="#364554" stroke-width="20" stroke-linecap="round"/>
    <path d="M427 184L456 199" stroke="#F0BF99" stroke-width="14" stroke-linecap="round"/>
    <path d="M325 153L291 191" stroke="#364554" stroke-width="20" stroke-linecap="round"/>
    <path d="M291 191L278 206" stroke="#F0BF99" stroke-width="14" stroke-linecap="round"/>

    <!-- small front lamp -->
    <ellipse cx="455" cy="230" rx="17" ry="11" fill="#DDF7FF"/>
  </g>

  <!-- subtle motion lines -->
  <path d="M58 220H128" stroke="#C7D0DA" stroke-width="9" stroke-linecap="round" opacity=".75"/>
  <path d="M24 253H106" stroke="#D7DEE6" stroke-width="7" stroke-linecap="round" opacity=".7"/>
  <path d="M84 287H151" stroke="#D7DEE6" stroke-width="7" stroke-linecap="round" opacity=".55"/>
</svg>